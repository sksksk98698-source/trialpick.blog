name: Auto Publish SEO/GEO Matrix Article (DeepSeek API)

on:
  schedule:
    # 每 4 天自动运行一次（UTC 02:00 / 北京时间 10:00）
    - cron: '0 2 */4 * *'
  # 支持在 GitHub Actions 界面随时手动一键触发执行
  workflow_dispatch:

# 赋予 GitHub Actions 提交并推送代码回主分支的写入权限
permissions:
  contents: write

jobs:
  publish:
    name: Generate & Publish SEO/GEO Matrix Article
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js 运行环境 (Node.js 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖 (Install Dependencies)
        run: npm ci || npm install

      - name: 调用 DeepSeek API 生成万字级 SEO/GEO 矩阵文章并执行防批量 URL 质检
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/auto-publish-deepseek.cjs

      - name: 编译静态站点并构建全文检索索引 (Verify VitePress Build & Pagefind)
        run: npm run docs:build

      - name: 验证 100% 联盟营销合规与 YMYL/E-E-A-T 规范 (Affiliate & Author Compliance)
        run: node scripts/check-compliance.js

      - name: 提交并推送到主分支 (Commit & Push to Main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ scripts/

          # 检查是否有新文章或配置变更需要提交
          if git diff --staged --quiet; then
            echo "没有检测到任何需要提交的变更。"
            exit 0
          fi

          # 【严格执行】：提交信息中绝不包含 [skip ci]，确保 Cloudflare Pages 自动感知推送并触发线上部署
          CURRENT_DATE=$(date +'%Y-%m-%d')
          git commit -m "chore(content): auto-publish new deep-dive SEO/GEO matrix article [$CURRENT_DATE]"

          git push origin main
